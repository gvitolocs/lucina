[package]
name = "lucina-venus"
version = "0.1.0"
description = "The SC7180 video block (Venus 4xx) after Linux's drivers/media/platform/qcom/venus and videocc-sc7180 (GPL-2.0): clocks, the shared queues, the firmware's start and HFI, a decode session: no_std, unsafe-free, host-tested"
# Spelled out rather than taken from the workspace: the kernel build copies this crate into the Asterinas tree
# (kernel/inject.txt).
edition = "2024"
publish = false
license = "GPL-2.0-only"

[dependencies]
lucina-qcom-soc = { path = "../../drivers/lucina-qcom-soc" }

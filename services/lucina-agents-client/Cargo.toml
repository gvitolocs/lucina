[package]
name = "lucina-agents-client"
version = "0.1.0"
description = "The /v1/agents client shared by Juno's Agents and CodeCor apps: API trait, wire models, store"
edition.workspace = true
publish.workspace = true

[dependencies]
lucina-account = { path = "../../services/lucina-account" }
lucina-app = { path = "../../apps/lucina-app" }
# The wire types, the timeline projection, tool-call display and state buckets. Changed only upstream in SecretaryIOS.
lucina-agents = { git = "https://github.com/gvitolocs/secretary-crates", rev = "7bd419174a7e51009341cc0fa29caae45c7d4660" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

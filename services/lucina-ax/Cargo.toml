[package]
name = "lucina-ax"
version = "0.1.0"
description = "Juno's AccessKit adapter: apps publish their screen as an AccessKit tree on a socket, and take actions by node id, for Lucina (docs/research/juno-ai-native.md, stage B)"
edition.workspace = true
publish.workspace = true

[dependencies]
# The tree is AccessKit's: the version egui 0.37 uses, so an egui app's update goes through unchanged. serde gives its JSON.
accesskit = { version = "0.25.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# The hash a decision is bound to, as lucina-intent-host and the server compute it.
sha2 = "0.10"

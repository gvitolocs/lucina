# userspace/ is its own Cargo workspace: its own profiles, .cargo config and edition 2021 (docs/rename-lucinaos.md).
exclude = ["third_party", "boot", "userspace", "minerva", "office", "artcraft", "ceres", "tools/lucina-video-bench", "tools/lucina-vault-docs"]

[workspace.package]
edition = "2024"
# Our own code is MIT (LICENSE, decision D-006). No licence field here: some crates hold files under the GPL, so one value would be wrong.
publish = false

# Every program on Juno's screen: small and fast on one CPU. A panic ends the process, and the shell reports it.
[profile.juno-app]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true

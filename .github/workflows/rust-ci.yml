# Build and test checks for the Rust workspace: docs/ci/VERUS.md. `rust-gate` is the required check and always runs.
# 22 workspace members depend on sibling repositories by absolute path (/home/user/...). They cannot build on a runner, so the
# launcher removes them, and whatever depends on them, in this checkout only, and prints the list. Nothing here deploys anything.
name: rust-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: never
  RUST_CI_TOOLCHAIN: 1.99.0

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        step: [fmt, clippy, nostd]
    name: ${{ matrix.step }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_CI_TOOLCHAIN" --profile minimal -c rustfmt -c clippy --no-self-update
          rustup default "$RUST_CI_TOOLCHAIN"
          rustup target add aarch64-unknown-none
      - name: Keep only the members that can build here
        run: |
          cargo run --quiet --release --locked --manifest-path tools/ci/lucina-ci/Cargo.toml -- portable-workspace --write | tee -a "$GITHUB_STEP_SUMMARY"
      - name: fmt
        if: matrix.step == 'fmt'
        run: bash tools/ci/ratchet.sh fmt
      - name: clippy
        if: matrix.step == 'clippy'
        run: bash tools/ci/ratchet.sh clippy
      - name: nostd
        if: matrix.step == 'nostd'
        run: |
          for p in lucina-mmu500 lucina-geni lucina-charge lucina-i2c-hid lucina-kexec lucina-fat lucina-klog lucina-ufs; do
            cargo check -p "$p" --target aarch64-unknown-none
          done
          cargo check -p lucina-bootimg -p lucina-fdt -p lucina-boot --no-default-features --target aarch64-unknown-none

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The media tests check our demuxers against FFmpeg's own reading, which differs between FFmpeg versions. This is the Ubuntu,
    # and so the FFmpeg (8.0.1), of the machine the tests were written on.
    container: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
    steps:
      - name: Tools
        run: |
          # The tests start ffmpeg and ffprobe, mkfs.fat and fsck.fat, ssh-keygen and kill.
          # The runner's DNS or mirror can fail for a minute (2026-11-11 13:49: "Could not resolve archive.ubuntu.com" failed two runs of a
          # commit that had passed). Only the download steps retry; the tests below never do. The rustup-init checksum is still checked.
          for attempt in 1 2 3 4; do
            # The container's own resolver (Docker's 127.0.0.11, forwarding to the runner's) failed for over 25 minutes from 13:49 while the
            # runner itself resolved fine. If the mirror does not resolve, ask public resolvers directly (the container is root).
            # Nothing else in the environment changes, and when the default resolver works this line does nothing.
            getent hosts archive.ubuntu.com > /dev/null || { echo "::warning::the container's resolver failed; using public resolvers"; printf 'nameserver 1.1.1.1\nnameserver 9.9.9.9\nnameserver 8.8.8.8\n' > /etc/resolv.conf; }
            if apt-get -o Acquire::Retries=5 update -qq && apt-get -o Acquire::Retries=5 install -yqq --no-install-recommends ca-certificates curl git build-essential pkg-config clang ffmpeg dosfstools openssh-client procps; then break; fi
            [ "$attempt" -lt 4 ] || { echo "::error::the package mirror did not answer in 4 attempts"; exit 100; }
            sleep $((attempt * 20))
          done
          base=https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu
          curl -fsSL --retry 5 --retry-all-errors -o rustup-init "$base/rustup-init"
          echo "$(curl -fsSL --retry 5 --retry-all-errors "$base/rustup-init.sha256" | cut -d' ' -f1)  rustup-init" | sha256sum -c --status
          chmod +x rustup-init && ./rustup-init -y --profile minimal --default-toolchain "$RUST_CI_TOOLCHAIN" --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rm rustup-init
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checkout (the container runs as root, the files belong to the runner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Keep only the members that can build here
        run: |
          cargo run --quiet --release --locked --manifest-path tools/ci/lucina-ci/Cargo.toml -- portable-workspace --write
      - name: test
        run: cargo test --workspace --no-fail-fast

  rust-gate:
    needs: [check, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "check=$CHECK test=$TEST"
          if [ "$CHECK" != success ]; then echo "::error::fmt, clippy or nostd failed"; exit 1; fi
          if [ "$TEST" != success ]; then echo "::error::the tests failed"; exit 1; fi

# Temporary. The same matrix, but the test binary is run directly with --nocapture, the way the launcher runs it, not through cargo test.
# three times over, so the one that stops is named by the job that does not end.
name: diag-matrix2
on:
  push:
    branches: ['diag/**', 'sync/diag**']

permissions:
  contents: read

jobs:
  one:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
        test:
          - check_fast_cache_root
          - check_fast_marker
          - check_fast_max_wait
          - check_fast_oos
          - check_fast_priority
          - check_fast_queue
          - check_fast_tool_swap
          - in_lane_worker
          - inventory_gone_unit
          - inventory_named_units
          - merge_gate_step_limits
          - merge_gate_timeout
          - merge_gate_waivers
          - runner_kill_scope
          - sweep_caches
          - sweep_main_debug
          - sweep_root
          - test_binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: cargo build --release --locked --manifest-path tools/ci/lucina-ci/Cargo.toml
      - name: ${{ matrix.test }} directly, run ${{ matrix.rep }}
        timeout-minutes: 6
        run: |
          cd tools/ci/lucina-ci
          cargo test --release --locked --no-run --test ${{ matrix.test }} 2>&1 | tail -n 2
          exe=$(ls -t target/release/deps/${{ matrix.test }}-* | grep -v "\.d$" | head -n 1)
          echo "exe=$exe"
          "$exe" --nocapture
  whole:
    # The step exactly as on main, eight times on eight runners: counts how often it stops.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: cargo build --release --locked --manifest-path tools/ci/lucina-ci/Cargo.toml
      - name: test-binaries as on main, run ${{ matrix.rep }}
        timeout-minutes: 6
        run: tools/ci/lucina-ci/target/release/lucina-ci test-binaries --manifest-path tools/ci/lucina-ci/Cargo.toml

# Temporary. The launcher test step stops now and then on a hosted runner, in any workflow. Each test binary on its own runner,
# three times over, so the one that stops is named by the job that does not end.
name: diag-matrix
on:
  push:
    branches: ['diag/**', 'sync/diag**']

permissions:
  contents: read

jobs:
  one:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
        test:
          - check_fast_cache_root
          - check_fast_marker
          - check_fast_max_wait
          - check_fast_oos
          - check_fast_priority
          - check_fast_queue
          - check_fast_tool_swap
          - in_lane_worker
          - inventory_gone_unit
          - inventory_named_units
          - merge_gate_step_limits
          - merge_gate_timeout
          - merge_gate_waivers
          - runner_kill_scope
          - sweep_caches
          - sweep_main_debug
          - sweep_root
          - test_binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ${{ matrix.test }}, run ${{ matrix.rep }}
        timeout-minutes: 6
        run: cargo test --release --locked --manifest-path tools/ci/lucina-ci/Cargo.toml --test ${{ matrix.test }}
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the unit tests of the launcher itself, run ${{ matrix.rep }}
        timeout-minutes: 6
        run: cargo test --release --locked --manifest-path tools/ci/lucina-ci/Cargo.toml --bin lucina-ci

\* Re-raise, must pass at EXP_BOUND = 1: BATCH = 1 and DELTAS = {2}, so every deadline is 2 ticks after its arm.
\* Covers the re-raise branch of IrqSoft (S # due) when the first softirq run comes AT the deadline (the tick is
\* already programmed for it), not one tick after it: two timers armed in the same tick come due together, the
\* first is popped at the deadline, the second one tick boundary later, at deadline + 1. Other constants as
\* JunoTimerqNextDeadlineReraise_bound2.cfg. Whether both timers are in fact due together here rests on that
\* reading of the model; no reachability witness has been run for it.
SPECIFICATION Spec
CONSTANTS
  CPUS = {c0, c1}
  TIMERS = {t1, t2}
  CAP = 4
  TMAX = 5
  DEVIRQS = 0
  ARMS = 2
  CANCELS = 1
  DELTAS = {2}
  BATCH = 1
  EXP_BOUND = 1
  Mutant = "none"
SYMMETRY Sym
CHECK_DEADLOCK TRUE
INVARIANTS TypeOK CacheIsRoot WakeAtTruthful TickingWhenRunning TickSoon ExpiryTaken ExpiryTakenTight ExpiryInTime

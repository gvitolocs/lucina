\* Bound too tight with three due timers (expected FAIL on ExpiryInTime; the design, Mutant = "none", is unchanged):
\* the constants of JunoTimerqNextDeadlineReraise_n3.cfg with EXP_BOUND = 2, one tick under ceil(3 due / BATCH 1).
\* The violation needs the third timer still queued at deadline + 3, so the failing trace is a run of the design that
\* pops one timer, re-raises, pops the second, re-raises again: it shows that Reraise_n3 reaches two re-raises and
\* that its bound 3 is tight. run.sh expects a violation from *Witness_* configurations but does not check WHICH
\* invariant fails: the log must say ExpiryInTime.
SPECIFICATION Spec
CONSTANTS
  CPUS = {c0, c1}
  TIMERS = {t1, t2, t3}
  CAP = 4
  TMAX = 5
  DEVIRQS = 0
  ARMS = 3
  CANCELS = 1
  DELTAS = {0, 2}
  BATCH = 1
  EXP_BOUND = 2
  Mutant = "none"
SYMMETRY Sym
CHECK_DEADLOCK TRUE
INVARIANTS TypeOK CacheIsRoot WakeAtTruthful TickingWhenRunning TickSoon ExpiryTaken ExpiryTakenTight ExpiryInTime

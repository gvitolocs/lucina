\* Re-raise with three due timers, must pass: the constants of JunoTimerqNextDeadlineReraise_bound2.cfg with a third
\* timer and a third arm (TIMERS {t1,t2,t3}, ARMS 3) and EXP_BOUND = 3 = ceil(3 due / BATCH 1). Checks the bound of
\* docs/design/juno-timerq.md section 12 ("The expiry bound") for N_due = 3, i.e. a first softirq run and two re-runs,
\* which the two-timer configurations cannot reach (at most one re-raise there). Same one-boundary-per-run assumption
\* (Waiting, softAt = now). Its must-fail twin one tick tighter is JunoTimerqNextDeadlineWitness_bound_tight_n3.cfg.
\* Added by the prover of record (Opus 5.5); the .tla and the other configurations are unchanged.
SPECIFICATION Spec
CONSTANTS
  CPUS = {c0, c1}
  TIMERS = {t1, t2, t3}
  CAP = 4
  TMAX = 5
  DEVIRQS = 0
  ARMS = 3
  CANCELS = 1
  DELTAS = {0, 2}
  BATCH = 1
  EXP_BOUND = 3
  Mutant = "none"
SYMMETRY Sym
CHECK_DEADLOCK TRUE
INVARIANTS TypeOK CacheIsRoot WakeAtTruthful TickingWhenRunning TickSoon ExpiryTaken ExpiryTakenTight ExpiryInTime

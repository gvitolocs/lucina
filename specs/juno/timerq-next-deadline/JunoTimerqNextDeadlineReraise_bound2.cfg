\* Re-raise, must pass: the constants of JunoTimerqNextDeadlineWitness_bound_tight_batch1.cfg with EXP_BOUND = 2.
\* Covers the re-raise branch of IrqSoft (S # due: BATCH = 1, two timers due at once, DELTAS has 0), which the base,
\* heavy and arms3 configurations cannot reach (BATCH = 2 with 2 timers), and with it the RUNNING hand-off between
\* a re-raising CPU and another CPU, and a cancel of the leftover. Bound: ceil(2 due / BATCH 1) = 2 ticks, on the
\* assumption that one softirq run crosses at most one tick boundary (Waiting, softAt = now).
SPECIFICATION Spec
CONSTANTS
  CPUS = {c0, c1}
  TIMERS = {t1, t2}
  CAP = 4
  TMAX = 5
  DEVIRQS = 0
  ARMS = 2
  CANCELS = 1
  DELTAS = {0, 2}
  BATCH = 1
  EXP_BOUND = 2
  Mutant = "none"
SYMMETRY Sym
CHECK_DEADLOCK TRUE
INVARIANTS TypeOK CacheIsRoot WakeAtTruthful TickingWhenRunning TickSoon ExpiryTaken ExpiryTakenTight ExpiryInTime

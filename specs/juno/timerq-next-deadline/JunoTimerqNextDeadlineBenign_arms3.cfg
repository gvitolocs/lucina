\* The design: 2 CPUs, 3 arms (re-arm in place of an armed timer included), no cancel, 5 ticks (must pass).
SPECIFICATION Spec
CONSTANTS
  CPUS = {c0, c1}
  TIMERS = {t1, t2}
  CAP = 4
  TMAX = 5
  DEVIRQS = 0
  ARMS = 3
  CANCELS = 0
  DELTAS = {2, 5}
  BATCH = 2
  EXP_BOUND = 1
  Mutant = "none"
SYMMETRY Sym
CHECK_DEADLOCK TRUE
INVARIANTS TypeOK CacheIsRoot WakeAtTruthful TickingWhenRunning TickSoon ExpiryTaken ExpiryTakenTight ExpiryInTime

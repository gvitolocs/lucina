\* Bound too tight (expected FAIL on ExpiryInTime; the design, Mutant = "none", is unchanged): BATCH = 1 with two
\* timers due at once (DELTAS has 0) makes the softirq run pop one and re-raise for the other. The first run comes
\* at the tick after the deadline and may cross one tick boundary, so the second timer is popped at deadline + 2:
\* EXP_BOUND = 1 does not hold here and never did (trace: evidence/juno-timerq-tlc/JunoTimerqNextDeadlineBenign_batch1.trace.txt;
\* amendment AMD-timerq-next-deadline-01). The same constants pass with EXP_BOUND = 2: JunoTimerqNextDeadlineReraise_bound2.cfg.
\* Until 2026-11-12 this file was JunoTimerqNextDeadlineBenign_batch1.cfg, wrongly labelled "must pass"; the constants
\* are exactly those. It is named Witness_ because run.sh expects a violation only from *Witness_* configurations;
\* run.sh does not check WHICH invariant fails: the reviewer checks that the log says ExpiryInTime, and only that.
SPECIFICATION Spec
CONSTANTS
  CPUS = {c0, c1}
  TIMERS = {t1, t2}
  CAP = 4
  TMAX = 5
  DEVIRQS = 0
  ARMS = 2
  CANCELS = 1
  DELTAS = {0, 2}
  BATCH = 1
  EXP_BOUND = 1
  Mutant = "none"
SYMMETRY Sym
CHECK_DEADLOCK TRUE
INVARIANTS TypeOK CacheIsRoot WakeAtTruthful TickingWhenRunning TickSoon ExpiryTaken ExpiryTakenTight ExpiryInTime

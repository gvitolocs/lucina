\* Benign: the RUNNING skip is caught by the holder's own next tick even if an expired timer read as none (must pass).
SPECIFICATION Spec
CONSTANTS
  CPUS = {0, 1}
  CAP = 3
  PERIOD = 4
  TMAX = 10
  DEVIRQS = 1
  RUN_BOUND = 1
  EXP_BOUND = 1
  Mutant = "expired_is_none"
  Regrid = FALSE
CHECK_DEADLOCK TRUE
INVARIANTS TypeOK WokenRunsInTime ExpiryInTime WakeAtTruthful ExpiryCovered NoSilentWork

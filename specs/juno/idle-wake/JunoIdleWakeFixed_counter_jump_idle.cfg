\* Fix: with Regrid, a counter jump on a CPU going idle heals at once (must pass).
SPECIFICATION Spec
CONSTANTS
  CPUS = {0, 1}
  CAP = 3
  PERIOD = 4
  TMAX = 10
  DEVIRQS = 1
  RUN_BOUND = 1
  EXP_BOUND = 1
  Mutant = "counter_jump_idle"
  Regrid = TRUE
CHECK_DEADLOCK TRUE
INVARIANTS TypeOK WokenRunsInTime ExpiryInTime WakeAtTruthful ExpiryCovered NoSilentWork

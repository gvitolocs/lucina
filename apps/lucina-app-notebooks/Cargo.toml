[package]
name = "lucina-app-notebooks"
version = "0.1.0"
description = "Secretary's Notebooks on Juno: sources, linked notes and a chat that cites them, on the lucina-notebooks routes"
edition.workspace = true
publish.workspace = true

[dependencies]
lucina-app = { path = "../../apps/lucina-app" }
lucina-account = { path = "../../services/lucina-account", features = ["ui"] }
lucina-app-support = { path = "../../apps/lucina-app-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The real engine, over real HTTP on loopback.
lucina-notebooks-sample = { path = "../../apps/lucina-notebooks-sample" }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

# Juno with no C library: Eyra (third_party/eyra-stack) is the libc and the program start, in Rust; docs/research/juno-pure-rust.md.
[target.'cfg(all(target_os = "linux", target_env = "gnu", target_arch = "aarch64"))'.dependencies]
eyra = { path = "../../third_party/eyra-stack/eyra" }

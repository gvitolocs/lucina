[package]
name = "lucina-app-reliability"
version = "0.1.0"
description = "Juno's Reliability app: a daily stability timeline from the event log, each event in plain words with a likely cause, its evidence and the kernel log lines it points at"
edition.workspace = true
publish.workspace = true

[dependencies]
lucina-app = { path = "../../apps/lucina-app" }
lucina-evlog = { path = "../../kernel/lucina-evlog" }
serde_json = "1"

# Juno with no C library: Eyra (third_party/eyra-stack) is the libc and the program start, in Rust; docs/research/juno-pure-rust.md.
[target.'cfg(all(target_os = "linux", target_env = "gnu", target_arch = "aarch64"))'.dependencies]
eyra = { path = "../../third_party/eyra-stack/eyra" }

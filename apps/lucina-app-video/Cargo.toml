[package]
name = "lucina-app-video"
version = "0.1.0"
description = "Video on Juno: decoded in Rust, following its sound, with resume and subtitles from secretary-player"
edition.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
lucina-account = { path = "../../services/lucina-account" }
lucina-app = { path = "../../apps/lucina-app" }
lucina-nav = { path = "../../services/lucina-nav" }
lucina-audio-decode = { path = "../../drivers/lucina-audio-decode" }
lucina-video = { path = "../../drivers/lucina-video" }
lucina-video-play = { path = "../../drivers/lucina-video-play" }
# Queue, resume positions and subtitles, as every Secretary app has them. Changed only upstream in SecretaryIOS.
secretary-player = { git = "https://github.com/gvitolocs/secretary-crates", rev = "7bd419174a7e51009341cc0fa29caae45c7d4660" }
serde_json = "1"

# Juno with no C library: Eyra (third_party/eyra-stack) is the libc and the program start, in Rust; docs/research/juno-pure-rust.md.
[target.'cfg(all(target_os = "linux", target_env = "gnu", target_arch = "aarch64"))'.dependencies]
eyra = { path = "../../third_party/eyra-stack/eyra" }
